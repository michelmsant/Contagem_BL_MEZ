<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2a4a">
    <title>Contagem BL_MEZ - Login</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    
    <style>
        /* Botão Dark Mode na tela de login */
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        .dark-mode-toggle:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }
        
        body.dark-mode .dark-mode-toggle {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        
        body.dark-mode .login-container {
            background: linear-gradient(160deg, #0a0f1a 0%, #1a2a4a 40%, #0a0f1a 100%);
        }
    </style>
</head>
<body>
    <!-- Botão Dark Mode -->
    <button class="dark-mode-toggle" id="darkModeToggle" title="Alternar modo escuro">🌙</button>

    <div class="login-container">
        <div class="login-card">
            <!-- Tela de Login -->
            <div id="loginScreen">
                <div class="login-header">
                    <div class="login-logo">📦</div>
                    <h1>CONTAGEM BL_MEZ</h1>
                    <p>Sistema de contagem de estoque</p>
                </div>
                
                <div class="error-message" id="loginError"></div>
                
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="loginUsuario" placeholder="Digite seu usuário" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" autocomplete="current-password">
                </div>
                
                <button class="btn btn-primary" id="btnLogin">
                    🔐 Entrar
                </button>
                
                <div class="login-footer">
                    Não tem conta? <a id="showCadastro">Cadastre-se</a>
                </div>
            </div>
            
            <!-- Tela de Cadastro -->
            <div id="cadastroScreen" style="display: none;">
                <div class="login-header">
                    <div class="login-logo">📝</div>
                    <h1>Novo Cadastro</h1>
                    <p>Crie sua conta de acesso</p>
                </div>
                
                <div class="error-message" id="cadastroError"></div>
                <div class="success-message" id="cadastroSuccess" style="display:none; background: var(--green-light); color: var(--green-dark); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; border: 1px solid rgba(16,185,129,0.2);"></div>
                
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cadastroNome" placeholder="Digite seu nome completo">
                </div>
                
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="cadastroUsuario" placeholder="Escolha um nome de usuário">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Crie uma senha">
                </div>
                
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="cadastroConfirmarSenha" placeholder="Confirme sua senha">
                </div>
                
                <button class="btn btn-success" id="btnCadastrar">
                    ✅ Criar Conta
                </button>
                
                <button class="btn btn-outline" id="showLogin">
                    ← Voltar para Login
                </button>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginScreen = document.getElementById('loginScreen');
            const cadastroScreen = document.getElementById('cadastroScreen');
            const loginError = document.getElementById('loginError');
            const cadastroError = document.getElementById('cadastroError');
            const cadastroSuccess = document.getElementById('cadastroSuccess');
            const darkModeToggle = document.getElementById('darkModeToggle');
            
            // Verificar se já está logado
            const currentUser = Auth.getCurrentUser();
            if (currentUser) {
                window.location.href = 'app.html';
                return;
            }
            
            // ============ DARK MODE ============
            function updateDarkModeButton() {
                const isDark = document.body.classList.contains('dark-mode');
                darkModeToggle.textContent = isDark ? '☀️' : '🌙';
                darkModeToggle.title = isDark ? 'Modo Claro' : 'Modo Escuro';
            }
            
            // Verificar preferência salva
            if (localStorage.getItem('blmez_darkmode') === '1') {
                document.body.classList.add('dark-mode');
            }
            updateDarkModeButton();
            
            // Toggle dark mode
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('blmez_darkmode', isDark ? '1' : '0');
                updateDarkModeButton();
            });
            
            // Alternar entre login e cadastro
            document.getElementById('showCadastro').addEventListener('click', (e) => {
                e.preventDefault();
                loginScreen.style.display = 'none';
                cadastroScreen.style.display = 'block';
                loginError.classList.remove('show');
            });
            
            document.getElementById('showLogin').addEventListener('click', (e) => {
                e.preventDefault();
                cadastroScreen.style.display = 'none';
                loginScreen.style.display = 'block';
                cadastroError.classList.remove('show');
                cadastroSuccess.style.display = 'none';
            });
            
            // Login
            document.getElementById('btnLogin').addEventListener('click', () => {
                const usuario = document.getElementById('loginUsuario').value;
                const senha = document.getElementById('loginSenha').value;
                
                if (!usuario || !senha) {
                    loginError.textContent = 'Preencha todos os campos.';
                    loginError.classList.add('show');
                    return;
                }
                
                const resultado = Auth.login(usuario, senha);
                
                if (resultado.sucesso) {
                    loginError.classList.remove('show');
                    showToast(resultado.mensagem, 'success');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 800);
                } else {
                    loginError.textContent = resultado.mensagem;
                    loginError.classList.add('show');
                }
            });
            
            document.getElementById('loginSenha').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('btnLogin').click();
            });
            
            document.getElementById('loginUsuario').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginSenha').focus();
            });
            
            // Cadastro
            document.getElementById('btnCadastrar').addEventListener('click', () => {
                const nome = document.getElementById('cadastroNome').value;
                const usuario = document.getElementById('cadastroUsuario').value;
                const senha = document.getElementById('cadastroSenha').value;
                const confirmarSenha = document.getElementById('cadastroConfirmarSenha').value;
                
                cadastroError.classList.remove('show');
                cadastroSuccess.style.display = 'none';
                
                if (!nome || !usuario || !senha || !confirmarSenha) {
                    cadastroError.textContent = 'Preencha todos os campos.';
                    cadastroError.classList.add('show');
                    return;
                }
                
                if (senha !== confirmarSenha) {
                    cadastroError.textContent = 'As senhas não conferem.';
                    cadastroError.classList.add('show');
                    return;
                }
                
                const resultado = Auth.cadastrar(nome, usuario, senha);
                
                if (resultado.sucesso) {
                    cadastroSuccess.textContent = resultado.mensagem + ' Redirecionando para login...';
                    cadastroSuccess.style.display = 'block';
                    document.getElementById('cadastroNome').value = '';
                    document.getElementById('cadastroUsuario').value = '';
                    document.getElementById('cadastroSenha').value = '';
                    document.getElementById('cadastroConfirmarSenha').value = '';
                    
                    setTimeout(() => {
                        cadastroScreen.style.display = 'none';
                        loginScreen.style.display = 'block';
                        cadastroSuccess.style.display = 'none';
                        document.getElementById('loginUsuario').focus();
                    }, 2000);
                } else {
                    cadastroError.textContent = resultado.mensagem;
                    cadastroError.classList.add('show');
                }
            });
            
            document.getElementById('loginUsuario').focus();
            
            // Toast function
            function showToast(msg, type) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + (type || '');
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        });
    </script>
</body>
</html>
