<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2a4a">
    <title>Contagem BL_MEZ - Login</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    
    <style>
        .dark-mode-toggle {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            color: white; width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; font-size: 1.3rem; display: flex;
            align-items: center; justify-content: center;
            transition: all var(--transition); backdrop-filter: blur(10px); z-index: 10;
        }
        .dark-mode-toggle:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
        body.dark-mode .dark-mode-toggle { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        body.dark-mode .login-container { background: linear-gradient(160deg, #0a0f1a 0%, #1a2a4a 40%, #0a0f1a 100%); }
        
        .loading-spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" id="darkModeToggle" title="Alternar modo escuro">🌙</button>

    <div class="login-container">
        <div class="login-card">
            <div id="loginScreen">
                <div class="login-header">
                    <div class="login-logo">📦</div>
                    <h1>CONTAGEM BL_MEZ</h1>
                    <p>Sistema de contagem de estoque</p>
                </div>
                
                <div class="error-message" id="loginError"></div>
                
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="loginUsuario" placeholder="Digite seu usuário" autocomplete="username" inputmode="text">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" autocomplete="current-password">
                </div>
                
                <button class="btn btn-primary" id="btnLogin">
                    <span id="loginText">🔐 Entrar</span>
                    <span class="loading-spinner" id="loginSpinner"></span>
                </button>
                
                <div class="login-footer">
                    Não tem conta? <a id="showCadastro">Cadastre-se</a>
                </div>
            </div>
            
            <div id="cadastroScreen" style="display: none;">
                <div class="login-header">
                    <div class="login-logo">📝</div>
                    <h1>Novo Cadastro</h1>
                    <p>Crie sua conta de acesso</p>
                </div>
                
                <div class="error-message" id="cadastroError"></div>
                <div class="success-message" id="cadastroSuccess" style="display:none; background: var(--green-light); color: var(--green-dark); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; border: 1px solid rgba(16,185,129,0.2);"></div>
                
                <div class="form-group"><label>Nome Completo</label><input type="text" id="cadastroNome" placeholder="Digite seu nome completo"></div>
                <div class="form-group"><label>Usuário</label><input type="text" id="cadastroUsuario" placeholder="Escolha um nome de usuário"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="cadastroSenha" placeholder="Crie uma senha"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="cadastroConfirmarSenha" placeholder="Confirme sua senha"></div>
                
                <button class="btn btn-success" id="btnCadastrar">✅ Criar Conta</button>
                <button class="btn btn-outline" id="showLogin">← Voltar para Login</button>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/utils.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Database.init();
            
            const loginScreen = document.getElementById('loginScreen');
            const cadastroScreen = document.getElementById('cadastroScreen');
            const loginError = document.getElementById('loginError');
            const cadastroError = document.getElementById('cadastroError');
            const cadastroSuccess = document.getElementById('cadastroSuccess');
            const darkModeToggle = document.getElementById('darkModeToggle');
            const btnLogin = document.getElementById('btnLogin');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            const currentUser = Auth.getCurrentUser();
            if (currentUser) { window.location.href = 'app.html'; return; }
            
            function updateDarkModeButton() {
                const isDark = document.body.classList.contains('dark-mode');
                darkModeToggle.textContent = isDark ? '☀️' : '🌙';
            }
            
            if (localStorage.getItem('blmez_darkmode') === '1') document.body.classList.add('dark-mode');
            updateDarkModeButton();
            
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('blmez_darkmode', document.body.classList.contains('dark-mode') ? '1' : '0');
                updateDarkModeButton();
            });
            
            document.getElementById('showCadastro').addEventListener('click', (e) => {
                e.preventDefault(); loginScreen.style.display = 'none'; cadastroScreen.style.display = 'block'; loginError.classList.remove('show');
            });
            
            document.getElementById('showLogin').addEventListener('click', (e) => {
                e.preventDefault(); cadastroScreen.style.display = 'none'; loginScreen.style.display = 'block'; cadastroError.classList.remove('show'); cadastroSuccess.style.display = 'none';
            });
            
            // ============ LOGIN (ASSÍNCRONO) ============
            btnLogin.addEventListener('click', async () => {
                const usuario = document.getElementById('loginUsuario').value;
                const senha = document.getElementById('loginSenha').value;
                
                if (!usuario || !senha) {
                    loginError.textContent = 'Preencha todos os campos.';
                    loginError.classList.add('show');
                    return;
                }
                
                // Mostrar loading
                loginText.style.display = 'none';
                loginSpinner.style.display = 'block';
                btnLogin.disabled = true;
                
                try {
                    const resultado = await Auth.login(usuario, senha);
                    
                    if (resultado.sucesso) {
                        loginError.classList.remove('show');
                        showToast(resultado.mensagem, 'success');
                        setTimeout(() => { window.location.href = 'app.html'; }, 500);
                    } else {
                        loginText.style.display = 'inline';
                        loginSpinner.style.display = 'none';
                        btnLogin.disabled = false;
                        loginError.textContent = resultado.mensagem;
                        loginError.classList.add('show');
                    }
                } catch (err) {
                    loginText.style.display = 'inline';
                    loginSpinner.style.display = 'none';
                    btnLogin.disabled = false;
                    loginError.textContent = 'Erro ao conectar. Tente novamente.';
                    loginError.classList.add('show');
                }
            });
            
            document.getElementById('loginSenha').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') btnLogin.click();
            });
            
            document.getElementById('loginUsuario').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginSenha').focus();
            });
            
            // ============ CADASTRO ============
            document.getElementById('btnCadastrar').addEventListener('click', () => {
                const nome = document.getElementById('cadastroNome').value;
                const usuario = document.getElementById('cadastroUsuario').value;
                const senha = document.getElementById('cadastroSenha').value;
                const confirmarSenha = document.getElementById('cadastroConfirmarSenha').value;
                
                cadastroError.classList.remove('show');
                cadastroSuccess.style.display = 'none';
                
                if (!nome || !usuario || !senha || !confirmarSenha) {
                    cadastroError.textContent = 'Preencha todos os campos.';
                    cadastroError.classList.add('show');
                    return;
                }
                
                if (senha !== confirmarSenha) {
                    cadastroError.textContent = 'As senhas não conferem.';
                    cadastroError.classList.add('show');
                    return;
                }
                
                const resultado = Auth.cadastrar(nome, usuario, senha);
                
                if (resultado.sucesso) {
                    cadastroSuccess.textContent = resultado.mensagem + ' Redirecionando...';
                    cadastroSuccess.style.display = 'block';
                    document.getElementById('cadastroNome').value = '';
                    document.getElementById('cadastroUsuario').value = '';
                    document.getElementById('cadastroSenha').value = '';
                    document.getElementById('cadastroConfirmarSenha').value = '';
                    
                    setTimeout(() => {
                        cadastroScreen.style.display = 'none';
                        loginScreen.style.display = 'block';
                        cadastroSuccess.style.display = 'none';
                        document.getElementById('loginUsuario').focus();
                    }, 1500);
                } else {
                    cadastroError.textContent = resultado.mensagem;
                    cadastroError.classList.add('show');
                }
            });
            
            document.getElementById('loginUsuario').focus();
            
            function showToast(msg, type) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + (type || '');
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        });
    </script>
</body>
</html>
